name: Testes SIFSM

on:
  push:
    branches:
      - integracao/persistencia-oracle-sifsm
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python
        run: python -m compileall -q codigo_fonte.py src ia tests
      - name: Run tests
        run: python -m pytest tests/ -q
